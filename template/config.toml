# eBPF File Monitor 配置
#
# 本文件由 WebUI / `ebpf-monitor ctl config-set` 管理（更新即时热重载），
# 实际生效位置是持久目录 /data/adb/ebpf-monitor/config.toml（模块更新不丢），
# 模块内的这份只是首次启动的种子副本。
#
# 原理：eBPF 挂在 raw_syscalls 上，对 [watch].basenames 里的文件名
# （路径最后一段）做匹配，命中即记录结构化事件（JSONL，重启不丢）：
#   ctl events 查询；WebUI 直接展示。
#
# 覆盖的操作：
#   * openat 带 O_CREAT(0x40)       -> 谁创建了文件
#   * renameat/renameat2/rename     -> 谁把临时文件改名成目标（原子写入模式）
#   * mkdirat/mkdir                 -> 谁创建了目录（把目录名加进 basenames 可抓到它）
#   * unlinkat/unlink               -> 谁删除了文件
#
# uid -> 包名由 daemon 读 /data/system/packages.list；
# 非应用进程（shell、原生守护进程）看事件的 cmd 字段（/proc/<pid>/cmdline）。

[whitelist]
uid = []
pid = []

# --- syscall 定义 ---

[[syscall]]
name = "openat"
nr = { arm64 = 56, arm32 = 322 }
arm64 = [
    { reg = 1, type = "str", name = "path" },
    { reg = 2, type = "int", name = "flags" },
]
arm32 = [
    { reg = 1, type = "str", name = "path" },
    { reg = 2, type = "int", name = "flags" },
]

[[syscall]]
name = "openat2"
nr = { arm64 = 437 }
arm64 = [
    { reg = 1, type = "str", name = "path" },
]

[[syscall]]
name = "creat"
nr = { arm32 = 8 }
arm32 = [
    { reg = 0, type = "str", name = "path" },
]

[[syscall]]
name = "mkdirat"
nr = { arm64 = 34, arm32 = 323 }
arm64 = [ { reg = 1, type = "str", name = "path" } ]
arm32 = [ { reg = 1, type = "str", name = "path" } ]

[[syscall]]
name = "mkdir"
nr = { arm32 = 39 }
arm32 = [ { reg = 0, type = "str", name = "path" } ]

[[syscall]]
name = "renameat"
nr = { arm64 = 38, arm32 = 329 }
arm64 = [
    { reg = 1, type = "str", name = "old" },
    { reg = 3, type = "str", name = "new" },
]
arm32 = [
    { reg = 1, type = "str", name = "old" },
    { reg = 3, type = "str", name = "new" },
]

[[syscall]]
name = "renameat2"
nr = { arm64 = 276, arm32 = 382 }
arm64 = [
    { reg = 1, type = "str", name = "old" },
    { reg = 3, type = "str", name = "new" },
]
arm32 = [
    { reg = 1, type = "str", name = "old" },
    { reg = 3, type = "str", name = "new" },
]

[[syscall]]
name = "rename"
nr = { arm32 = 38 }
arm32 = [
    { reg = 0, type = "str", name = "old" },
    { reg = 1, type = "str", name = "new" },
]

[[syscall]]
name = "unlinkat"
nr = { arm64 = 35, arm32 = 328 }
arm64 = [ { reg = 1, type = "str", name = "path" } ]
arm32 = [ { reg = 1, type = "str", name = "path" } ]

[[syscall]]
name = "unlink"
nr = { arm32 = 10 }
arm32 = [ { reg = 0, type = "str", name = "path" } ]

# --- syscall 分组 ---

[[syscall_groups]]
name = "create"
syscalls = ["openat"]
watch_flag_param = "flags"
watch_flag_mask = 0x40   # O_CREAT

[[syscall_groups]]
name = "create_any"
syscalls = ["openat2", "creat", "mkdirat", "mkdir"]

[[syscall_groups]]
name = "rename_"
syscalls = ["renameat", "renameat2", "rename"]
watch_param = "new"      # 监视重命名目标（源是 tmp 文件名）

[[syscall_groups]]
name = "open_"
syscalls = ["openat"]

[[syscall_groups]]
name = "delete"
syscalls = ["unlinkat", "unlink"]

# --- watch 配置 ---
# 监视目标（basename）。WebUI「设置 → 监视目标」直接增删此处。

[watch]
basenames = []
groups = ["create", "create_any", "rename_", "delete"]

